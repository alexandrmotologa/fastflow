<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0f19" />
      <stop offset="1" stop-color="#06080e" />
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="nodeEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10b981" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="nodePurple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#10b981" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="120" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Graph Emblems -->
  <g transform="translate(30, 20)">
    <!-- Conduit Path 1 -->
    <path d="M 20 40 C 40 40, 50 15, 75 15" stroke="url(#edgeGrad)" stroke-width="3" fill="none" opacity="0.8" />
    <!-- Conduit Path 2 -->
    <path d="M 20 40 C 40 40, 50 65, 75 65" stroke="url(#edgeGrad)" stroke-width="3" fill="none" opacity="0.8" />

    <!-- Pulsing Particles -->
    <circle cx="48" cy="27" r="3.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="52" cy="55" r="3.5" fill="#38bdf8" filter="url(#glow)" />

    <!-- Node 1 (Trigger) -->
    <circle cx="20" cy="40" r="14" fill="url(#nodeEmerald)" filter="url(#glow)" />
    <circle cx="20" cy="40" r="6" fill="#ecfdf5" />

    <!-- Node 2 (Action) -->
    <circle cx="75" cy="15" r="12" fill="url(#nodeBlue)" />
    <circle cx="75" cy="15" r="5" fill="#eff6ff" />

    <!-- Node 3 (Output) -->
    <circle cx="75" cy="65" r="12" fill="url(#nodePurple)" />
    <circle cx="75" cy="65" r="5" fill="#faf5ff" />
  </g>

  <!-- Typography -->
  <text x="145" y="58" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#f8fafc" letter-spacing="-0.03em">
    Fast<tspan fill="#38bdf8">Flow</tspan>
  </text>
  <text x="145" y="82" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748b" letter-spacing="0.05em">
    VISUAL DAG AUTOMATION ENGINE
  </text>
</svg>
